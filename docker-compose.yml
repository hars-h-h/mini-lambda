version: '3.9'

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: faas
      POSTGRES_PASSWORD: faas
      POSTGRES_DB: faas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faas"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    build: ./auth
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://faas:faas@postgres:5432/faas
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
